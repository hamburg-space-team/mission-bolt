# Probe 2: the ST-Link V2. SWD only - no virtual COM port, so it can flash
# and debug but never carries telemetry.
set PROBE_VID_PID {0x0483 0x3748}
set PROBE_SERIAL  {}
set GDB_PORT    3402
set TELNET_PORT 4402
set TCL_PORT    6602
# V2 table: 5..480 / 950 / 1800 / 4000 kHz - 1000 and 3300 are not on it
set SPEED_CONNECT 950
set SPEED_BOOST   1800
