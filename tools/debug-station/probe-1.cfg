# Probe 1: the ST-Link V3. It is the only adapter with a virtual COM port,
# so the downlink always rides this one - /dev/ttySTLINK points at it.
# Pinned by model while the two probes differ; set PROBE_SERIAL instead once
# a second V3 joins the bus (OpenOCD prints it as "ST-LINK SN:").
set PROBE_VID_PID {0x0483 0x374f}
set PROBE_SERIAL  {}
set GDB_PORT    3401
set TELNET_PORT 4401
set TCL_PORT    6601
# V3 table: 200 / 1000 / 3300 / 8000 / 24000 kHz
set SPEED_CONNECT 1000
set SPEED_BOOST   3300
