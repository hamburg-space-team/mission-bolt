# One config for every probe. openocd-bolt@<id>.service sources
# probe-<id>.cfg first, which sets the values below, so a bench with two
# adapters runs two instances off one file. The defaults keep the
# single-probe case working: openocd -f station.cfg by hand still serves 3401.
#
# Which adapter an instance takes: PROBE_VID_PID pins it by model (enough
# while the probes differ - V3 is 374f, V2 is 3748), PROBE_SERIAL by serial
# (needed once two of the same model are on the bus). A V2's serial is raw
# bytes, so use the hex form OpenOCD prints as "ST-LINK SN:".
if {![info exists GDB_PORT]}      { set GDB_PORT 3401 }
if {![info exists TELNET_PORT]}   { set TELNET_PORT 4401 }
if {![info exists TCL_PORT]}      { set TCL_PORT 6601 }
if {![info exists PROBE_VID_PID]} { set PROBE_VID_PID "" }
if {![info exists PROBE_SERIAL]}  { set PROBE_SERIAL "" }
# Adapter speed tables differ per model, and asking for a rate that is not on
# the table drops silently to the next one down. V3: 200/1000/3300/8000/24000,
# V2: 5..480/950/1800/4000
if {![info exists SPEED_CONNECT]} { set SPEED_CONNECT 1000 }
if {![info exists SPEED_BOOST]}   { set SPEED_BOOST 3300 }

source [find interface/stlink.cfg]
# narrows the stock vid_pid list down to this instance's adapter
if {$PROBE_VID_PID ne ""} { eval st-link vid_pid $PROBE_VID_PID }
if {$PROBE_SERIAL ne ""}  { adapter serial $PROBE_SERIAL }
transport select swd

bindto 0.0.0.0
gdb_port $GDB_PORT
telnet_port $TELNET_PORT
tcl_port $TCL_PORT

source [find target/stm32l4x.cfg]
$_TARGETNAME configure -gdb-max-connections 2

# The stock stm32l4x.cfg asks for 500 kHz before the clock boost and 4000
# after, neither of which is on the V3's table, so it silently lands on 200 -
# five times slower than a rate that exists. Ask for real ones.
adapter speed $SPEED_CONNECT
$_TARGETNAME configure -event reset-start "
    adapter speed $SPEED_CONNECT
"
# Replaces the stock handler, so it has to repeat the clock boost: without
# MSI at 24 MHz the faster SWD clock has nothing to talk to
$_TARGETNAME configure -event reset-init "
    mww 0x40022000 0x00000103
    mww 0x40021000 0x00000099
    adapter speed $SPEED_BOOST
"
reset_config srst_only srst_nogate connect_assert_srst
adapter srst delay 100
adapter srst pulse_width 100

# connect_assert_srst attaches with the target held in reset, which makes the
# connect reliable but leaves the board halted - and nothing resumes it until
# a flash ends in "reset run". A Pi reboot therefore parks whichever board the
# probe sits on, silently, for as long as it stays there. Let it run.
#
# init is explicit so the resume has somewhere to hang; it already fails hard
# with no target attached (OpenOCD exits, systemd retries every 2 s), which is
# the behaviour we want. catch keeps a board that cannot be reset - NRST is
# not wired on every connector - from turning that into a restart loop.
init
catch { reset run }
