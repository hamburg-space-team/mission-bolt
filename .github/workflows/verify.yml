name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build devcontainer and run the verify gate
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: ${{ github.event_name == 'push' && 'always' || 'never' }}
          runCmd: |
            git config --global --add safe.directory "$PWD"
            # post-create regenerates the schema artifacts; restore the
            # committed versions so schema-drift checks the commit, not
            # the fresh regen
            git checkout -- interfaces/tools/generated docs/interfaces/ICD-007-packet-payloads.md
            scripts/verify.sh
