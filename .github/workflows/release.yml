name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  packages: read # pull the devcontainer image cache

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, verify and package in the devcontainer
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: |
            git config --global --add safe.directory "$PWD"
            git checkout -- interfaces/tools/generated docs/interfaces/ICD-007-packet-payloads.md
            cd flight-software
            cbuild bolt.csolution.yml \
              --context btc.Release+btc --context exp1.Release+exp1-space-disco \
              --context exp2.Release+exp2-bouncy-castle --context exp3.Release+exp3-floaty-boi
            cd ..
            scripts/verify.sh
            scripts/package-release.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "BOLT flight software ${GITHUB_REF_NAME}" \
            --generate-notes
