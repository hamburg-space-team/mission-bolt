project:
  generators:
    options:
      - generator: CubeMX
        path: ./generated
        name: btc

  packs:
    - pack: Keil::STM32L4xx_DFP@3.1.0

  add-path:
    - ./app

  components:
    - component: Device:CubeMX
    - component: ARM::CMSIS:CORE
    - component: ARM::CMSIS-Compiler:CORE
    - component: CMSIS Driver:I2C
    - component: CMSIS Driver:USART

  linker:
    - script: generated/STM32CubeMX/STM32CubeIDE/STM32L476RGTX_FLASH.ld
      for-compiler: GCC

  layers:
    - layer: ../shared/shared.clayer.yml
    - layer: ../lib/lib.clayer.yml

  groups:
    - group: Application
      files:
        - file: app/main.cpp
        - file: app/btc/btc_computer.cpp
        - file: app/btc/telemetry_emitter.cpp
        - file: app/btc/imu_supervisor.cpp
        - file: app/board/hal_btc_board.cpp
        - file: app/board/btc_isr.cpp
