[workspace]
resolver = "2"
members = [
    "crates/bolt-codec",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Hamburg Space Team"]
repository = "https://github.com/hamburg-space-team/mission-bolt"


[workspace.dependencies]
bolt-codec = { path = "crates/bolt-codec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
heapless = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
